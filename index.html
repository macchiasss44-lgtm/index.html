<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Condivisione posizione</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>📍 Condivisione posizione</h1>

  <p>
    Premi il pulsante per condividere la tua posizione
    con questa pagina.
  </p>

  <button onclick="getLocation()">
    Condividi posizione
  </button>

  <div id="result"></div>

</div>

<script>

function getLocation() {

  const result = document.getElementById("result");

  if (!navigator.geolocation) {
    result.innerHTML =
      "La geolocalizzazione non è supportata dal browser.";
    return;
  }

  result.innerHTML = "Richiesta della posizione...";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      const maps =
        "https://www.google.com/maps?q=" +
        latitude + "," + longitude;

      result.innerHTML =
        "<b>Posizione ricevuta.</b><br><br>" +
        "Latitudine: " + latitude + "<br>" +
        "Longitudine: " + longitude + "<br>" +
        "Precisione stimata: circa " +
        Math.round(accuracy) + " metri<br><br>" +
        '<a href="' + maps +
        '" target="_blank">Apri su Google Maps</a>';
    },

    function(error) {

      if (error.code === 1) {
        result.innerHTML =
          "Permesso di localizzazione negato.";
      } else if (error.code === 2) {
        result.innerHTML =
          "Posizione non disponibile.";
      } else if (error.code === 3) {
        result.innerHTML =
          "Tempo scaduto durante la richiesta.";
      } else {
        result.innerHTML =
          "Impossibile ottenere la posizione.";
      }

    },

    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }

  );
}

</script>

</body>
</html>
